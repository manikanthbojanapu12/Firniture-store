<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found — STACKLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="error-page-body">

  <!-- Loader -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-inner">
      <div class="loader-icon"><i class="fas fa-couch"></i></div>
      <div class="loader-logo">
        <img src="stacklylogo-transparent.webp" alt="STACKLY" class="loader-logo-img" />
      </div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <!-- Background Orbs -->
  <div class="hero-orb orb-1" style="opacity: 0.25;"></div>
  <div class="hero-orb orb-2" style="opacity: 0.25;"></div>

  <div class="error-container">
    <div class="error-content-box">
      <!-- Premium Logo Icon -->
      <div class="error-logo-wrap">
        <a href="index.html">
          <img src="stacklylogo-transparent.webp" alt="STACKLY Logo" class="error-logo" />
        </a>
      </div>

      <!-- Main 404 Heading -->
      <div class="error-code">404</div>
      
      <!-- Subtitle -->
      <h1 class="error-headline">Lost in Design</h1>
      <p class="error-message">The page you are looking for does not exist, has been archived, or was moved to an uncharted space.</p>
      
      <!-- Call to Action -->
      <div class="error-cta d-flex gap-3 justify-content-center">
        <button onclick="history.back()" class="btn btn-outline-lumis btn-lg">
          <i class="fas fa-arrow-left me-2"></i> Go Back
        </button>
        <a href="index.html" class="btn btn-lumis btn-lg">
          <i class="fas fa-home me-2"></i> Return to Home
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
