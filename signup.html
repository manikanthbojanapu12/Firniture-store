<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — STACKLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page-body">

  <!-- Loader -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-inner">
      <div class="loader-icon"><i class="fas fa-couch"></i></div>
      <div class="loader-logo">
        <img src="stacklylogo-transparent.webp" alt="STACKLY" class="loader-logo-img" />
      </div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <div class="auth-wrapper">
    <!-- Left Column (Visual) -->
    <div class="auth-visual-column">
      <div class="auth-visual-overlay"></div>
      <picture>
        <source srcset="assets/images/furniture-about-showroom.webp" type="image/webp" />
        <img src="assets/images/furniture-about-showroom.webp" alt="STACKLY Furniture & Living Store" class="auth-visual-img" />
      </picture>
      <div class="auth-visual-content">
        <h2 class="auth-visual-title"><span class="reveal-line"><span>Join The Atelier</span></span></h2>
        <p class="auth-visual-sub">Create an account to save furniture pieces, track deliveries, and book interior consultations.</p>
      </div>
    </div>

    <!-- Right Column (Form) -->
    <div class="auth-form-column">
      <a href="index.html" class="auth-back-btn">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
      
      <div class="auth-form-card-wrapper">
        <div class="auth-brand-logo-container">
          <a href="index.html"><img src="stacklylogo-transparent.webp" alt="STACKLY" class="auth-brand-logo" /></a>
        </div>
        
        <h3 class="auth-title">Create Account</h3>
        <p class="auth-subtitle">Join the STACKLY Furniture & Living store</p>

        <!-- Role Switcher -->
        <div class="role-switcher-container mt-4">
          <button type="button" class="role-pill active" data-role="customer">
            <i class="fas fa-user-circle me-2"></i> Customer
          </button>
          <button type="button" class="role-pill" data-role="admin">
            <i class="fas fa-user-shield me-2"></i> Admin
          </button>
          <input type="hidden" id="selectedRole" name="role" value="customer" />
        </div>

        <!-- Signup Form -->
        <form id="lumisSignupForm" class="mt-4">
          <div class="row g-3">
            <div class="col-6">
              <div class="lumis-form-group">
                <input type="text" class="lumis-input" placeholder=" " id="suFirst" required oninput="this.value=this.value.replace(/[0-9]/g,'')" />
                <label for="suFirst">First Name</label>
              </div>
            </div>
            <div class="col-6">
              <div class="lumis-form-group">
                <input type="text" class="lumis-input" placeholder=" " id="suLast" required oninput="this.value=this.value.replace(/[0-9]/g,'')" />
                <label for="suLast">Last Name</label>
              </div>
            </div>
          </div>
          
          <div class="lumis-form-group mt-3">
            <input type="email" class="lumis-input" placeholder=" " id="suEmail" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.com$" oninput="this.setCustomValidity(''); if(this.value && !this.checkValidity()) this.setCustomValidity('Enter a valid email address')" />
            <label for="suEmail">Email Address</label>
          </div>
          
          <div class="lumis-form-group mt-3">
            <input type="password" class="lumis-input" placeholder=" " id="suPass" required />
            <label for="suPass">Password</label>
          </div>
          
          <div class="lumis-form-group mt-3">
            <input type="password" class="lumis-input" placeholder=" " id="suConfirmPass" required />
            <label for="suConfirmPass">Confirm Password</label>
          </div>

          <!-- Dynamic Admin Secret Group -->
          <div class="lumis-form-group mt-3 d-none" id="adminSecretGroup">
            <input type="password" class="lumis-input" placeholder=" " id="suAdminSecret" />
            <label for="suAdminSecret">Admin Invitation Code</label>
          </div>
          
          <div class="form-check lumis-check mt-3 mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required />
            <label class="form-check-label" for="termsCheck">
              I agree to the <a href="404.html" class="forgot-link">Terms of Service</a> & <a href="404.html" class="forgot-link">Privacy Policy</a>
            </label>
          </div>
          
          <button type="submit" class="btn btn-lumis w-100 btn-lg">Create Account</button>
        </form>

        <p class="modal-switch mt-4">Already have an account? <a href="login.html">Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="login_signup.js"></script>
</body>
</html>
