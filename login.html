<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — STACKLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page-body">

  <!-- Loader -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-inner">
      <div class="loader-icon"><i class="fas fa-couch"></i></div>
      <div class="loader-logo">
        <img src="stacklylogo-transparent.webp" alt="STACKLY" class="loader-logo-img" />
      </div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <div class="auth-wrapper">
    <!-- Left Column (Visual) -->
    <div class="auth-visual-column">
      <div class="auth-visual-overlay"></div>
      <picture>
        <source srcset="assets/images/furniture-about-showroom.webp" type="image/webp" />
        <img src="assets/images/furniture-about-showroom.webp" alt="STACKLY Furniture & Living Store" class="auth-visual-img" />
      </picture>
      <div class="auth-visual-content">
        <h2 class="auth-visual-title"><span class="reveal-line"><span>Elevate Your Living</span></span></h2>
        <p class="auth-visual-sub">Sign in to track orders, manage wishlists, and view bespoke furniture deliveries.</p>
      </div>
    </div>

    <!-- Right Column (Form) -->
    <div class="auth-form-column">
      <a href="index.html" class="auth-back-btn">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
      
      <div class="auth-form-card-wrapper">
        <div class="auth-brand-logo-container">
          <a href="index.html"><img src="stacklylogo-transparent.webp" alt="STACKLY" class="auth-brand-logo" /></a>
        </div>
        
        <h3 class="auth-title">Welcome Back</h3>
        <p class="auth-subtitle">Sign in to your electronics account</p>

        <!-- Role Switcher -->
        <div class="role-switcher-container mt-4">
          <button type="button" class="role-pill active" data-role="customer">
            <i class="fas fa-user-circle me-2"></i> Customer
          </button>
          <button type="button" class="role-pill" data-role="admin">
            <i class="fas fa-user-shield me-2"></i> Admin
          </button>
          <input type="hidden" id="selectedRole" name="role" value="customer" />
        </div>

        <!-- Login Form -->
        <form id="lumisLoginForm" class="mt-4">
          <div class="lumis-form-group">
            <input type="email" class="lumis-input" placeholder=" " id="loginEmail" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.com$" oninput="this.setCustomValidity(''); if(this.value && !this.checkValidity()) this.setCustomValidity('Enter a valid email address')" />
            <label for="loginEmail">Email Address</label>
          </div>
          <div class="lumis-form-group mt-3">
            <input type="password" class="lumis-input" placeholder=" " id="loginPass" required />
            <label for="loginPass">Password</label>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
            <div class="form-check lumis-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="404.html" class="forgot-link">Forgot password?</a>
          </div>
          
          <button type="submit" class="btn btn-lumis w-100 btn-lg">Sign In</button>
        </form>

        <div class="modal-divider"><span>or continue with</span></div>
        
        <div class="social-login-btns">
          <a href="404.html" class="social-btn"><i class="fab fa-google"></i> Google</a>
          <a href="404.html" class="social-btn"><i class="fab fa-facebook-f"></i> Facebook</a>
        </div>

        <p class="modal-switch mt-4">Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="login_signup.js"></script>
</body>
</html>
